name: Platform Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  Apple:
    name: ${{ matrix.platform }}
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: ['ios', 'macos', 'maccatalyst', 'tvos', 'visionos', 'watchos']
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Test ${{ matrix.platform }}
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            ios)
              xcodebuild clean test -workspace . -scheme SwifterJSON -destination "platform=iOS Simulator,name=iPhone 18 Pro,OS=27"
              ;;
            tvos)
              xcodebuild clean test -workspace . -scheme SwifterJSON -destination "platform=tvOS Simulator,name=Apple TV 4K (3rd generation),OS=27"
              ;;
            macos)
              swift test --parallel
              ;;
            maccatalyst)
              xcodebuild clean test -workspace . -scheme SwifterJSON -destination "platform=macOS,variant=Mac Catalyst"
              ;;
            watchos)
              xcodebuild clean test -workspace . -scheme SwifterJSON -destination "platform=watchOS Simulator,name=Apple Watch Series 12 (42mm),OS=27"
              ;;
            visionos)
              xcodebuild clean test -workspace . -scheme SwifterJSON -destination "platform=visionOS Simulator,name=Apple Vision Pro,OS=27"
              ;;
          esac

  Linux:
    runs-on: ubuntu-26.04
    container: swift:6.4
    steps:
      - uses: actions/checkout@v1
      - name: Test Linux
        run: swift test --parallel

  Android:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Test Android
        uses: skiptools/swift-android-action@v2

  WASM:
    runs-on: ubuntu-26.04
    container: swift:6.4
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift SDK for WebAssembly
        run: swift sdk install https://github.com/swiftwasm/swift/releases/download/swift-wasm-6.3-RELEASE/swift-wasm-6.3-RELEASE-wasm32-unknown-wasip1.artifactbundle.zip --checksum 6704d137e532f1ac31eafedd80658f9ee61239f2b6291216a02da32361ea9dcb
      - name: Print Swift SDK list
        run: swift sdk list
      - name: Build for WASM
        run: swift build --swift-sdk 6.3-RELEASE-wasm32-unknown-wasip1
